name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a vulnerability published for an existing dependency (or a
  # newly added gitleaks rule) surfaces even in a week with no pushes.
  schedule:
    - cron: "0 9 * * 1"

# The workflow's token can only read the repository. No job here needs to
# write to it, so a compromised step can't push code, tags or releases.
permissions:
  contents: read

# Third-party actions are pinned to an exact commit (the tag it was at is in
# the comment), so a tag being moved to different code can't change what runs
# here. Dependabot (.github/dependabot.yml) opens PRs to move the pins forward.
jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: packages' install scripts don't run. That is the usual
      # way a malicious dependency attacks a build, and nothing here needs one
      # (it also skips this project's own "prepare", which only sets up git hooks).
      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm run lint

      - run: npm test

      # The Firestore emulator (used by the security-rules tests) needs Java.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firestore security-rules tests
        run: npm run test:rules

      # Which lines of firestore.rules the tests reached (tests/rulesCoverage.ts).
      - name: Upload rules coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-rules-coverage
          path: coverage/rules/summary.txt
          if-no-files-found: ignore

  # Two headless browsers as two devices on one account, against the Auth and
  # Firestore emulators: sign-in, sync, an edit conflict, the device list.
  # Not required to pass yet (continue-on-error): browser tests can fail for
  # reasons that aren't bugs, so this reports for a while before it can block
  # a merge. Remove continue-on-error once it has proved steady.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Two-device end-to-end test
        run: npm run test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the secret scan covers every commit, not just the tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # npm audit reads package-lock.json, so no install is needed first.
      # Blocking: fails CI on any high or critical advisory (dev dependencies
      # included). Dependabot opens the PRs that fix these.
      - name: Dependency audit (fails on high severity)
        run: npm audit --audit-level=high

      # Checks that each installed package really is the one the npm registry
      # published (its signature and, where a package has one, its provenance).
      # Needs the packages on disk, so this is the one install in this job.
      - name: Verify package signatures
        run: |
          npm ci --ignore-scripts
          npm audit signatures

      # Secret scanning with gitleaks' default rules plus .gitleaks.toml (which
      # allowlists only the public Firebase web key). The plain binary rather
      # than gitleaks-action, pinned to a version so a new release can't
      # change results without a commit here.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml --exit-code 1 .
