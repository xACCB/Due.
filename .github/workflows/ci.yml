name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm test

      # The Firestore emulator (used by the security-rules tests) needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firestore security-rules tests
        run: npm run test:rules

      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high || true
