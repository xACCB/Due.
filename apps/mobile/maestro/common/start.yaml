# Run first by every test: whatever an earlier test left open, get back to an
# unscrolled Home with the sidebar closed.
appId: com.duestudios.dueplanner
---
- tapOn:
    text: "Exit Focus Mode"
    optional: true
- tapOn:
    text: "Close sidebar"
    optional: true
- tapOn:
    text: "Close Search"
    optional: true
- assertVisible: "Open sidebar"
# Home, whichever screen a failed run ended on.
- tapOn: "Open sidebar"
- tapOn: "Home"
# Two long pulls down bring Home's list to the top. (scrollUntilVisible on
# "Search tasks" passed while the field sat scrolled up behind the header:
# Maestro counts an element inside the screen as visible even when clipped.)
- swipe:
    start: 50%, 35%
    end: 50%, 90%
    duration: 400
- swipe:
    start: 50%, 35%
    end: 50%, 90%
    duration: 400
