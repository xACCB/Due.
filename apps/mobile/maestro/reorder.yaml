# Drag to reorder (List layout, no grouping): the grip moves a task below the
# next one, and dragging it back up restores the order. Reordering isn't an
# undo step, so the flow puts it back itself. The grip is inside the card,
# which VoiceOver (and so Maestro) reads as one element, so the drags aim at
# its spot: the top-left of the first card on an unscrolled Home.
appId: com.duestudios.dueplanner
name: Drag to reorder
---
- assertVisible:
    text: "Problem set 4,.*"
    below: "Chapter 3 reading,.*"
- swipe:
    start: 42, 330
    end: 42, 450
    duration: 2000
- assertVisible:
    text: "Chapter 3 reading,.*"
    below: "Problem set 4,.*"
- swipe:
    start: 42, 475
    end: 42, 320
    duration: 2000
- assertVisible:
    text: "Problem set 4,.*"
    below: "Chapter 3 reading,.*"
