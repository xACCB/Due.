# Settings -> Task list -> Show completed: off hides the done task on Home,
# on brings it back.
appId: com.duestudios.dueplanner
name: Settings switch takes effect
---
- runFlow: common/start.yaml
- scrollUntilVisible:
    element: "Worksheet 2.*"
- tapOn: "Open sidebar"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Task list"
# Open the section unless it already is (Settings stays as it was left).
- runFlow:
    when:
      notVisible:
        id: "switch Show completed tasks"
    commands:
      - tapOn: "Task list"
- scrollUntilVisible:
    element:
      id: "switch Show completed tasks"
- tapOn:
    id: "switch Show completed tasks"
- tapOn: "Open sidebar"
- tapOn: "Home"
- scrollUntilVisible:
    element: "Add homework"
- assertNotVisible: "Worksheet 2.*"
- tapOn: "Open sidebar"
- tapOn: "Settings"
- tapOn:
    id: "switch Show completed tasks"
- tapOn: "Task list"
- tapOn: "Open sidebar"
- tapOn: "Home"
- scrollUntilVisible:
    element: "Worksheet 2.*"
- scrollUntilVisible:
    element: "Home"
    direction: UP
