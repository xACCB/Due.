<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuePlanner — Due Studios</title>
    <meta name="description" content="A fast, highly personalizable homework and task planner: due dates, subjects, recurring tasks, reminders, and focus tools, all in one place." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dueplanner.vercel.app/" />
    <meta property="og:title" content="DuePlanner" />
    <meta property="og:description" content="A fast, highly personalizable homework and task planner: due dates, subjects, recurring tasks, reminders, and focus tools, all in one place." />
    <meta property="og:image" content="https://dueplanner.vercel.app/favicon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DuePlanner" />
    <meta name="twitter:description" content="A fast, highly personalizable homework and task planner: due dates, subjects, recurring tasks, reminders, and focus tools, all in one place." />
    <meta name="twitter:image" content="https://dueplanner.vercel.app/favicon-512.png" />
    <!-- The app's fonts. Loaded here, without blocking, rather than by an
         @import in the app's runtime stylesheet (which held back the whole
         stylesheet until the fonts answered). Same family list as FONT.google
         in src/App.tsx. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" /></noscript>
    <!-- The "dp" mark in the header and sidebar (DP_MARK_FONT in src/App.tsx):
         only those two letters of Bodoni Moda, so it's a tiny download. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda&text=dp&display=swap" media="print" onload="this.media='all'" />
    <script>
      // Prevents a flash of the browser's default white background for
      // returning dark-theme users: paints the last-known theme background
      // synchronously, before React mounts and injects the real stylesheet.
      // App.tsx keeps "hw-bg" in sync with the active theme's background.
      try {
        var bg = localStorage.getItem("hw-bg");
        if (bg) document.documentElement.style.background = bg;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Launch screen: the dp mark on black, shown at once (before the app's
         code has loaded) and faded out when the app has drawn, but never sooner
         than about half a second so it doesn't just flicker. Plain HTML and a
         small script, so it needs nothing from the app to appear. -->
    <style>
      #splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .28s ease;}
      #splash.hide{opacity:0;pointer-events:none;}
      @media (prefers-reduced-motion:reduce){#splash{transition:none;}}
    </style>
    <div id="splash" aria-hidden="true">
      <svg width="132" height="132" viewBox="0 0 100 100" role="img" aria-label="DuePlanner">
        <text x="50" y="66" text-anchor="middle" font-family="'Bodoni MT', Georgia, 'Times New Roman', serif" font-size="52" fill="#fff">dp</text>
      </svg>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("splash"), root = document.getElementById("root");
        var shownAt = Date.now(), MIN_MS = 600, done = false;
        function hide() {
          if (done) return; done = true;
          setTimeout(function () {
            splash.classList.add("hide");
            setTimeout(function () { splash.remove(); }, 320);
          }, Math.max(0, MIN_MS - (Date.now() - shownAt)));
        }
        if (root.firstChild) { hide(); return; }
        var seen = new MutationObserver(function () { if (root.firstChild) { seen.disconnect(); hide(); } });
        seen.observe(root, { childList: true });
        // Never leave it up if the app fails to start.
        setTimeout(function () { seen.disconnect(); hide(); }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
